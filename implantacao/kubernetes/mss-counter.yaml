#deployments vem de apps/v1
apiVersion: apps/v1
#tipo
kind: Deployment
metadata:
  #nome do deployment
  name: counter-deployment
spec:
  #quantas cópias
  replicas: 1
  #para especificar o rótulo
  selector:
    matchLabels:
    #rótulo, app não tem nada de especial, pode ser qq coisa
    #Deployment vai selecionar todo Pod que tiver esse rótulo
      app: counter
  #modelo que vai ser usado para construção dos Pods
  template:
    metadata:
      labels:
        #os Pods terão esse rótulo, assim,
        #serão selecionados por esse deployment
        app: counter
    spec:
      containers:
        - name: counter
          image: counter-image
          imagePullPolicy: Never
          resources:
            limits:
              memory: 256Mi
              cpu: 1
---
apiVersion: v1
kind: Service
metadata:
  #nome diferente do outro de tipo nodePort
  #que havíamos criado
  name: counter-clusterip-service
spec:
  selector:
    app: counter
  ports:
    - name: counter
      protocol: TCP
      port: 7000
      targetPort: 7000
---
apiVersion: v1
kind: Service
metadata:
  name: counter-service
spec:
  # Ip externo, acessível fora do cluster
  type: NodePort
  selector:
    # todo Pod que tiver essa tag
    # fará parte desse serviço
    app: counter
  ports:
    - name: counter
      protocol: TCP
      # o nó recebe requisições nessa porta
      port: 7000
      # e direciona para essa porta do Pod
      targetPort: 7000
      nodePort: 30007