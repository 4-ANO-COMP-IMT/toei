#deployments vem de apps/v1
apiVersion: apps/v1
#tipo
kind: Deployment
metadata:
  #nome do deployment
  name: artwork-deployment
spec:
  #quantas cópias
  replicas: 1
  #para especificar o rótulo
  selector:
    matchLabels:
    #rótulo, app não tem nada de especial, pode ser qq coisa
    #Deployment vai selecionar todo Pod que tiver esse rótulo
      app: artwork
  #modelo que vai ser usado para construção dos Pods
  template:
    metadata:
      labels:
        #os Pods terão esse rótulo, assim,
        #serão selecionados por esse deployment
        app: artwork
    spec:
      containers:
        - name: artwork
          image: artwork-image
          imagePullPolicy: Never
          resources:
            limits:
              memory: 256Mi
              cpu: 1
---
apiVersion: v1
kind: Service
metadata:
  #nome diferente do outro de tipo nodePort
  #que havíamos criado
  name: artwork-clusterip-service
spec:
  selector:
    app: artwork
  ports:
    - name: artwork
      protocol: TCP
      port: 5000
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: artwork-service
spec:
  # Ip externo, acessível fora do cluster
  type: NodePort
  selector:
    # todo Pod que tiver essa tag
    # fará parte desse serviço
    app: artwork
  ports:
    - name: artwork
      protocol: TCP
      # o nó recebe requisições nessa porta
      port: 5000
      # e direciona para essa porta do Pod
      targetPort: 5000
      nodePort: 30005